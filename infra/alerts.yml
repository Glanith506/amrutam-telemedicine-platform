groups:
  - name: amrutam
    rules:
      - alert: APIUnavailable
        expr: up{job="amrutam"} == 0
        for: 1m
        labels: {severity: critical}
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.01
        for: 5m
      - alert: SlowReads
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{method="GET"}[5m]))) > 0.2
        for: 5m
      - alert: SlowWrites
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{method=~"POST|PATCH"}[5m]))) > 0.5
        for: 5m
