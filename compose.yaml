services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amrutam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/generate_env.py first}
      POSTGRES_DB: amrutam
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U amrutam"]
      interval: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://amrutam:${POSTGRES_PASSWORD}@db:5432/amrutam
    command: [python, -m, app.manage, init-db]
    depends_on:
      db: {condition: service_healthy}
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://amrutam:${POSTGRES_PASSWORD}@db:5432/amrutam
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: amrutam-api
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://amrutam:${POSTGRES_PASSWORD}@db:5432/amrutam
    command: [python, -m, app.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
  prometheus:
    image: prom/prometheus:v3.7.3
    volumes: ["./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./infra/alerts.yml:/etc/prometheus/alerts.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["127.0.0.1:16686:16686"]
volumes:
  pgdata:
