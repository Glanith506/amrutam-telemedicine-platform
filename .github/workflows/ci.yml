name: backend-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.lock.txt pip-audit bandit
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run test:ui
        working-directory: frontend
      - run: python -m pytest -q
        working-directory: backend
      - run: bandit -r backend/app -ll
      - run: pip-audit -r backend/requirements.lock.txt
      - run: docker build -f backend/Dockerfile -t amrutam:${{ github.sha }} .
